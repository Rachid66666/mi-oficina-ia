<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#111111">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<title>Mi Oficina IA</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700&family=Public+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
/* Layout: barra lateral fija con los agentes + área de trabajo; en móvil la barra pasa a pestañas arriba */
:root{
  --yellow:#ffc400; --yellow-soft:#fff4c7;
  --bg:#f5f4ef; --surface:#ffffff; --surface-2:#efede4; --ink:#141414; --muted:#5d5a50; --line:#dcd8cb;
  --accent:#141414; --accent-soft:#fff1b8; --accent-ink:#ffd21f; --pine:#121212; --pine-soft:#fff1b8;
  --ok:#2b7a4b; --ok-soft:#dcefe3; --warn:#9a6312; --warn-soft:#f6ead2; --bad:#b4372a; --bad-soft:#f7dfdb;
  --shadow:0 1px 2px rgba(20,20,20,.06),0 4px 16px rgba(20,20,20,.06);
  --c-panel:#ffc400; --c-asistente:#ffc400; --c-clientes:#ffc400; --c-agenda:#ffc400; --c-trabajos:#ffc400; --c-presupuestos:#ffc400; --c-facturas:#ffc400; --c-gastos:#ffc400; --c-mensajes:#ffc400; --c-ajustes:#ffc400;
  --m-ink:#141414;
  --f-display:"Bricolage Grotesque","Public Sans",system-ui,sans-serif;
  --f-body:"Public Sans",system-ui,-apple-system,"Segoe UI",sans-serif;
  --f-mono:"IBM Plex Mono",ui-monospace,"SFMono-Regular",Menlo,monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0c0c0b; --surface:#171714; --surface-2:#211f1a; --ink:#f2f0e8; --muted:#a6a293; --line:#302d26;
  --accent:#ffc400; --accent-soft:#2e2709; --accent-ink:#121212; --pine:#ffc400; --pine-soft:#2e2709; --yellow-soft:#2e2709;
  --ok:#62c48d; --ok-soft:#173326; --warn:#e2ab52; --warn-soft:#3a2d16; --bad:#ef7a69; --bad-soft:#3c1f1b;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 4px 16px rgba(0,0,0,.25);
  color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0c0c0b; --surface:#171714; --surface-2:#211f1a; --ink:#f2f0e8; --muted:#a6a293; --line:#302d26;
  --accent:#ffc400; --accent-soft:#2e2709; --accent-ink:#121212; --pine:#ffc400; --pine-soft:#2e2709; --yellow-soft:#2e2709;
  --ok:#62c48d; --ok-soft:#173326; --warn:#e2ab52; --warn-soft:#3a2d16; --bad:#ef7a69; --bad-soft:#3c1f1b;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 4px 16px rgba(0,0,0,.25);
  color-scheme:dark}

*{box-sizing:border-box}
html,body{height:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.5}
h1,h2,h3{font-family:var(--f-display);font-weight:700;line-height:1.15;margin:0;text-wrap:balance}
h1{font-size:1.75rem;letter-spacing:-.01em}
h2{font-size:1.2rem}
h3{font-size:1rem}
p{margin:0}
button,input,select,textarea{font:inherit;color:inherit}
.num{font-family:var(--f-mono);font-variant-numeric:tabular-nums}
.muted{color:var(--muted)}
.small{font-size:.85rem}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

.app{display:grid;grid-template-columns:236px minmax(0,1fr);min-height:100%}
.side{background:#0d0d0d;color:#f3f1e8;border-right:4px solid var(--yellow);padding:20px 14px;display:flex;flex-direction:column;gap:18px;position:sticky;top:0;height:100vh}
:root[data-theme="dark"] .side{background:#000;color:var(--ink)}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .side{background:#000;color:var(--ink)}}
.brand{display:flex;gap:10px;align-items:center;padding:0 6px}
.brand svg{flex:none}
.brand b{font-family:var(--f-display);font-size:1.05rem;display:block;line-height:1.1}
.brand span{font-size:.75rem;opacity:.75}
.nav{display:flex;flex-direction:column;gap:2px}
.nav button{display:flex;align-items:center;gap:10px;border:0;background:transparent;color:inherit;padding:9px 10px;border-radius:8px;text-align:left;cursor:pointer;opacity:.85;font-weight:500}
.nav button:hover{background:rgba(255,255,255,.08);opacity:1}
.nav button[aria-current="true"]{background:var(--yellow);color:#111;opacity:1;font-weight:700}
.nav button[aria-current="true"] .icobox{background:#111;color:var(--yellow)}
.nav .ico{width:18px;height:18px;flex:none}
.nav .badge{margin-left:auto;background:var(--yellow);color:#111;border-radius:99px;font-size:.72rem;padding:0 7px;font-weight:700}
.side-foot{margin-top:auto;font-size:.75rem;opacity:.75;padding:0 6px;display:flex;flex-direction:column;gap:6px}
.mode{display:inline-flex;align-items:center;gap:6px}
.mode i{width:8px;height:8px;border-radius:50%;background:#e8b04d;display:inline-block}
.mode.live i{background:#6fd59b}

main{padding-inline:28px;padding-block:24px 60px;min-width:0;display:flex;flex-direction:column;gap:20px;max-width:1240px;width:100%}
.head{display:flex;gap:16px;align-items:flex-end;justify-content:space-between;flex-wrap:wrap}
.head .eyebrow{font-size:.72rem;letter-spacing:.08em;text-transform:uppercase;color:var(--accent);font-weight:700;margin-bottom:4px}
.head p{color:var(--muted);max-width:62ch;margin-top:4px}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}

.btn{border:1px solid var(--line);background:var(--surface);padding:8px 14px;border-radius:8px;cursor:pointer;font-weight:600;font-size:.9rem;display:inline-flex;align-items:center;gap:6px;text-decoration:none;color:var(--ink);white-space:nowrap}
.btn:hover{border-color:var(--muted)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.primary:hover{filter:brightness(1.07)}
.btn.agent{background:var(--pine-soft);border-color:transparent;color:var(--pine)}
.btn.agent::before{content:"";width:8px;height:8px;border-radius:50%;background:currentColor;box-shadow:0 0 0 3px color-mix(in srgb,currentColor 25%,transparent)}
.btn.ghost{background:transparent}
.btn.sm{padding:4px 10px;font-size:.8rem}
.btn.danger{color:var(--bad)}
.btn:disabled{opacity:.5;cursor:default}

.card{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:18px;min-width:0}
.card > h2,.card > h3{margin-bottom:12px}
.grid{display:grid;gap:16px}
.kpis{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px}
.kpi{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:14px 16px;display:flex;flex-direction:column;gap:2px;min-width:0}
.kpi .l{font-size:.75rem;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);font-weight:600}
.kpi .v{font-family:var(--f-display);font-size:1.6rem;font-weight:700;font-variant-numeric:tabular-nums}
.kpi .s{font-size:.82rem;color:var(--muted)}
.two{display:grid;grid-template-columns:minmax(0,1.35fr) minmax(0,1fr);gap:16px;align-items:start}

.pill{display:inline-flex;align-items:center;gap:5px;font-size:.75rem;font-weight:600;padding:2px 9px;border-radius:99px;background:var(--surface-2);color:var(--muted);white-space:nowrap}
.pill.ok{background:var(--ok-soft);color:var(--ok)}
.pill.warn{background:var(--warn-soft);color:var(--warn)}
.pill.bad{background:var(--bad-soft);color:var(--bad)}
.pill.info{background:var(--accent-soft);color:var(--accent)}
.pill.ex{background:transparent;border:1px dashed var(--line)}

.alerts{display:flex;flex-direction:column}
.alert{display:grid;grid-template-columns:4px minmax(0,1fr) auto;gap:12px;align-items:center;padding:10px 0;border-top:1px solid var(--line)}
.alert:first-child{border-top:0}
.alert .bar{align-self:stretch;border-radius:2px;background:var(--muted)}
.alert.bad .bar{background:var(--bad)} .alert.warn .bar{background:var(--warn)} .alert.info .bar{background:var(--accent)} .alert.ok .bar{background:var(--ok)}
.alert b{font-weight:600}

.tablewrap{overflow-x:auto;margin-inline:-4px}
table{width:100%;border-collapse:collapse;font-size:.9rem}
th{text-align:left;font-size:.72rem;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);font-weight:600;padding:8px 6px;border-bottom:1px solid var(--line);white-space:nowrap}
td{padding:9px 6px;border-bottom:1px solid var(--line);vertical-align:middle}
tr:last-child td{border-bottom:0}
td.r,th.r{text-align:right}
tr.click{cursor:pointer}
tr.click:hover td{background:var(--surface-2)}
tr.sel td{background:var(--accent-soft)}

.toolbar{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:8px;overflow:hidden;background:var(--surface)}
.seg button{border:0;background:transparent;padding:6px 12px;cursor:pointer;font-size:.85rem;font-weight:600;color:var(--muted)}
.seg button[aria-pressed="true"]{background:var(--ink);color:var(--bg)}
input[type=text],input[type=search],input[type=email],input[type=tel],input[type=number],input[type=date],input[type=time],select,textarea{background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:8px 10px;width:100%;min-width:0}
textarea{resize:vertical;min-height:70px}
label.f{display:flex;flex-direction:column;gap:4px;font-size:.8rem;font-weight:600;color:var(--muted);min-width:0}
label.f > span{letter-spacing:.02em}
.form{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
.form .full{grid-column:1/-1}

.week{display:grid;gap:10px}
.day{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:12px 14px}
.day.today{border-color:var(--accent);box-shadow:inset 3px 0 0 var(--accent)}
.day-h{display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap;margin-bottom:6px}
.day-h h3::first-letter{text-transform:uppercase}
.visit{display:grid;grid-template-columns:62px minmax(0,1fr) auto;gap:12px;align-items:center;padding:8px 0;border-top:1px dashed var(--line)}
.visit:first-of-type{border-top:0}
.visit .t{font-family:var(--f-mono);font-size:.9rem}
.visit.done .what{opacity:.6;text-decoration:line-through}
.empty{color:var(--muted);font-size:.9rem;padding:6px 0}

.agent-out{border:1px solid var(--line);border-left:3px solid var(--pine);border-radius:10px;background:var(--surface);padding:14px 16px;display:flex;flex-direction:column;gap:10px}
.agent-head{font-size:.75rem;text-transform:uppercase;letter-spacing:.07em;font-weight:700;color:var(--pine);display:flex;gap:8px;align-items:center;justify-content:space-between}
.agent-text{white-space:pre-wrap;line-height:1.6;max-height:520px;overflow:auto}
.agent-note{font-size:.8rem;color:var(--muted)}

.ficha dl{display:grid;grid-template-columns:110px minmax(0,1fr);gap:6px 12px;margin:0;font-size:.9rem}
.ficha dt{color:var(--muted)}
.ficha dd{margin:0;overflow-wrap:anywhere}
.stats{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px;margin-block:14px}
.stat{background:var(--surface-2);border-radius:8px;padding:8px 10px}
.stat .v{font-family:var(--f-mono);font-weight:500}
.stat .l{font-size:.72rem;color:var(--muted);text-transform:uppercase;letter-spacing:.05em}
.hist{display:flex;flex-direction:column;gap:6px;font-size:.88rem}
.hist div{display:flex;justify-content:space-between;gap:8px}

.chart text{fill:var(--muted);font-family:var(--f-mono);font-size:11px}
.chart .grid{stroke:var(--line)}
.chart .bar{fill:var(--c-facturas);opacity:.75}
.chart .bar.cur{fill:var(--c-facturas);opacity:1}
.chart .val{fill:var(--ink)}
.chart .bi{fill:var(--ok);opacity:.55}.chart .bi.cur{opacity:1}.chart .bg{fill:var(--bad);opacity:.45}.chart .bg.cur{opacity:.9}
.chart .val.pos{fill:var(--ok)}.chart .val.neg{fill:var(--bad)}.chart .mbar{cursor:pointer}.chart .mbar:hover rect{opacity:1}
.key{display:inline-block;width:10px;height:10px;border-radius:2px;margin:0 4px 0 2px;vertical-align:-1px}.key.ki{background:var(--ok)}.key.kg{background:var(--bad);opacity:.7;margin-left:8px}
.pos{color:var(--ok)}.neg{color:var(--bad)}
.tboard{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px;margin-top:14px;align-items:start}
.tcol{background:var(--surface-2);border-radius:14px;padding:12px;display:flex;flex-direction:column;gap:10px;border-top:4px solid var(--yellow)}
.tcol-h{display:flex;justify-content:space-between;align-items:center}
.tcard{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:12px;display:flex;flex-direction:column;gap:8px;box-shadow:var(--shadow)}
.tcard.urg{border-left:4px solid var(--bad)}
.tcard-main{all:unset;cursor:pointer;display:flex;flex-direction:column;gap:2px}
.tcard-main:hover b{text-decoration:underline;text-decoration-color:var(--yellow);text-decoration-thickness:2px}
.todos{display:flex;flex-direction:column}
.todo{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:9px 0;border-top:1px solid var(--line)}
.todo:first-child{border-top:0}
details.card summary{cursor:pointer}
@media (max-width:900px){.tboard{grid-template-columns:minmax(0,1fr)}}
.card.month{border-top:4px solid var(--m)}
.mstats{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px;margin-bottom:12px}
.mstats>div{background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:10px 12px;display:flex;flex-direction:column;gap:2px;min-width:0}
.mstats .l{font-size:.78rem;color:var(--muted);font-weight:600}.mstats .v{font-size:1.25rem;font-weight:700;font-variant-numeric:tabular-nums}
.verdict{font-size:.95rem;font-weight:600}.verdict b{display:block;font-size:1.25rem}
.verdict.pos{color:var(--ok)}.verdict.neg{color:var(--bad)}
table.wk tfoot td{border-top:2px solid var(--line);padding-top:10px}
table.wk tr.fut td{opacity:.6}
table.wk tr.wkdet td{background:var(--bg);padding:8px 12px}
@media (max-width:700px){.mstats{grid-template-columns:repeat(2,minmax(0,1fr))}
 table.wk thead{display:none} table.wk,table.wk tbody,table.wk tfoot{display:block;width:100%}
 table.wk tr{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:6px 10px;padding:10px 6px;border-bottom:1px solid var(--line)}
 table.wk td{border:0!important;padding:0!important;text-align:left!important;background:none!important} table.wk td:first-child,table.wk tr.wkdet td{grid-column:1/-1}
 table.wk tr.sel{background:var(--accent-soft)} table.wk tr.wkdet{background:var(--bg)} table.wk td.hide-m{display:none}
 table.wk td[data-l]::before{content:attr(data-l);display:block;font-family:var(--f-sans,inherit);font-size:.72rem;color:var(--muted);font-weight:600}}

.overlay{position:fixed;inset:0;background:rgba(8,16,13,.45);display:flex;align-items:flex-start;justify-content:center;padding:max(24px,env(safe-area-inset-top,0px)) 16px 24px;overflow:auto;z-index:20}
.modal{background:var(--bg);border-radius:14px;width:min(760px,100%);box-shadow:0 20px 60px rgba(0,0,0,.3);display:flex;flex-direction:column}
.modal-h{display:flex;justify-content:space-between;align-items:center;padding:16px 20px;border-bottom:1px solid var(--line);gap:12px}
.modal-b{padding:18px 20px;display:flex;flex-direction:column;gap:14px}
.modal-f{padding:14px 20px;border-top:1px solid var(--line);display:flex;justify-content:flex-end;gap:8px;flex-wrap:wrap}
.lines input{padding:6px 8px}
.lines td{padding:5px 4px}
.totals{display:grid;grid-template-columns:auto auto;gap:4px 18px;justify-content:end;font-size:.92rem}
.totals .grand{font-weight:700;font-size:1.05rem}
.route{display:flex;flex-direction:column;gap:0;counter-reset:s}
.route li{list-style:none;display:grid;grid-template-columns:28px minmax(0,1fr) auto;gap:10px;align-items:center;padding:8px 0;border-top:1px solid var(--line)}
.route li .n{width:24px;height:24px;border-radius:50%;background:var(--accent);color:var(--accent-ink);display:grid;place-items:center;font-size:.75rem;font-weight:700}
.route li.base .n{background:var(--pine);color:var(--bg)}

.invoice{background:#fff;color:#1b1b1b;border-radius:8px;padding:28px;font-size:.88rem;border:1px solid var(--line)}
.invoice h2{font-size:1.4rem;color:#1e4a37}
.invoice table th{color:#666;border-color:#ddd}
.invoice table td{border-color:#eee}
.inv-top{display:flex;justify-content:space-between;gap:20px;flex-wrap:wrap;margin-bottom:20px}
.toast{position:fixed;bottom:calc(20px + env(safe-area-inset-bottom,0px));left:50%;transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:10px;font-weight:600;z-index:40;font-size:.9rem;max-width:calc(100% - 32px)}
.ask{display:flex;gap:8px}
.gev{display:grid;grid-template-columns:62px minmax(0,1fr) auto;gap:12px;align-items:center;padding:6px 0;border-top:1px dashed var(--line);color:var(--muted);font-size:.88rem}
.gev .t{font-family:var(--f-mono)}
.gtag{display:inline-flex;align-items:center;gap:5px;font-size:.72rem;font-weight:600;color:var(--muted)}
.gtag::before{content:"";width:8px;height:8px;border-radius:2px;background:#4285f4}
.calbar{display:flex;gap:10px;align-items:center;flex-wrap:wrap;background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:10px 14px}
.calbar .gtag{font-size:.85rem;color:var(--ink)}
a.lnk{color:var(--accent);font-weight:600;text-decoration:underline;text-decoration-color:var(--yellow);text-decoration-thickness:2px;text-underline-offset:2px}
a.lnk:hover{text-decoration:underline}
.btn.wa{background:#1f9d55;border-color:#1f9d55;color:#fff}
.chatcard{display:flex;flex-direction:column;gap:12px}
.chat-top{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap}
.chat-log{max-height:560px;min-height:160px;overflow:auto;display:flex;flex-direction:column;gap:10px;padding:12px;background:var(--bg);border:1px solid var(--line);border-radius:10px}
.msg{max-width:min(85%,640px);padding:10px 13px;border-radius:14px;white-space:pre-wrap;line-height:1.55;overflow-wrap:anywhere}
.msg.u{align-self:flex-end;background:var(--accent);color:var(--accent-ink);border-bottom-right-radius:4px}
.msg.a{align-self:flex-start;background:var(--surface);border:1px solid var(--line);border-bottom-left-radius:4px}
.msg.sys{align-self:center;font-size:.82rem;color:var(--muted);background:transparent;padding:2px}
.chat-in{display:flex;gap:8px;align-items:flex-end}
.chat-in textarea{flex:1;min-height:52px;max-height:200px}
.draft{border:1px solid var(--pine);border-radius:12px;background:var(--surface);padding:14px;display:flex;flex-direction:column;gap:10px;align-self:stretch}
.draft-h{display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap;align-items:baseline}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chip{border:1px solid var(--line);background:var(--surface);border-radius:99px;padding:5px 11px;font-size:.82rem;cursor:pointer;color:var(--ink)}
.chip:hover{border-color:var(--accent)}
.icobox{width:28px;height:28px;border-radius:8px;display:grid;place-items:center;flex:none;background:var(--m);color:var(--m-ink)}
.icobox svg{width:17px;height:17px}
.nav button[aria-current="true"] .icobox{box-shadow:0 0 0 2px rgba(255,255,255,.55)}
.hero{display:flex;gap:16px;align-items:center;justify-content:space-between;flex-wrap:wrap;padding:18px 20px;border-radius:16px;background:linear-gradient(120deg,color-mix(in srgb,var(--m) 16%,var(--surface)),color-mix(in srgb,var(--m) 4%,var(--surface)) 70%);border:1px solid color-mix(in srgb,var(--m) 25%,var(--line));position:relative;overflow:hidden}
.hero{border-left:6px solid var(--yellow)}
.hero::after{content:"";position:absolute;right:-40px;top:-60px;width:220px;height:220px;border-radius:50%;background:color-mix(in srgb,var(--m) 10%,transparent);pointer-events:none}
.hero-l{display:flex;gap:16px;align-items:center;min-width:0;flex:1 1 380px}
.hero-ico{width:58px;height:58px;border-radius:16px;background:#111;color:var(--yellow);display:grid;place-items:center;flex:none;box-shadow:0 6px 18px color-mix(in srgb,var(--m) 35%,transparent)}
.hero-ico svg{width:32px;height:32px}
.hero .eyebrow{color:var(--ink);opacity:.7}
.hero .row{position:relative;z-index:1}
.quick{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:10px}
.qa{display:flex;flex-direction:column;gap:8px;align-items:flex-start;padding:14px;border-radius:14px;border:1px solid color-mix(in srgb,var(--m) 30%,var(--line));background:color-mix(in srgb,var(--m) 9%,var(--surface));cursor:pointer;text-align:left;color:var(--ink);font-weight:600;font-size:.9rem;transition:transform .12s}
.qa:hover{transform:translateY(-2px);border-color:var(--m)}
.qa .icobox{width:38px;height:38px;border-radius:11px}
.qa .icobox svg{width:22px;height:22px}
.qa small{font-weight:400;color:var(--muted);font-size:.78rem}
.kpi{border-top:4px solid var(--m,var(--accent))}
.kpi .l{display:flex;align-items:center;gap:6px}
.kpi .l::before{content:"";width:8px;height:8px;border-radius:50%;background:var(--m,var(--accent))}
.av{width:34px;height:34px;border-radius:50%;display:inline-grid;place-items:center;color:#fff;font-weight:700;font-size:.8rem;flex:none;letter-spacing:.02em}
.av.lg{width:52px;height:52px;font-size:1.1rem}
.who{display:flex;gap:10px;align-items:center}
.brand-logo{width:38px;height:38px;border-radius:10px;object-fit:contain;background:#fff;padding:2px;flex:none}
.logo-prev{width:96px;height:96px;border-radius:14px;border:1px dashed var(--line);display:grid;place-items:center;overflow:hidden;background:var(--surface)}
.logo-prev img{max-width:100%;max-height:100%}
@media (max-width:1100px){.quick{grid-template-columns:repeat(4,minmax(0,1fr))}}
@media (max-width:560px){.quick{grid-template-columns:repeat(2,minmax(0,1fr))}.hero-ico{width:46px;height:46px;border-radius:13px}.hero-ico svg{width:26px;height:26px}.hero{padding:14px}}
.snap{display:flex;gap:14px;align-items:center;padding:14px;border:2px dashed color-mix(in srgb,var(--c-gastos) 45%,var(--line));border-radius:14px;background:color-mix(in srgb,var(--c-gastos) 7%,var(--surface));flex-wrap:wrap}
.snap img{width:84px;height:84px;object-fit:cover;border-radius:10px;border:1px solid var(--line)}
.snap .big{background:#111;border-color:#111;color:var(--yellow);font-size:1rem;padding:12px 18px}
.receipt{max-width:100%;max-height:70vh;border-radius:10px;display:block;margin:auto}
.act{align-self:stretch;border:1px dashed var(--line);border-radius:10px;padding:8px 12px;font-size:.88rem;display:flex;gap:10px;align-items:center;justify-content:space-between;flex-wrap:wrap;background:var(--surface)}
.act b{color:var(--ok)}
.act.err b{color:var(--bad)}
.ask input{flex:1}
.cat-row{display:grid;grid-template-columns:minmax(0,1fr) 90px 90px auto;gap:6px;align-items:center}

@media (max-width:1000px){.kpis{grid-template-columns:repeat(2,minmax(0,1fr))}.two{grid-template-columns:minmax(0,1fr)}}
@media (max-width:860px){
  .app{grid-template-columns:minmax(0,1fr)}
  .side{position:sticky;top:env(safe-area-inset-top,0px);height:auto;padding:10px 12px;gap:8px;z-index:10;flex-direction:row;align-items:center}
  .brand span,.side-foot{display:none}
  .brand b{font-size:.95rem}
  .nav{flex-direction:row;overflow-x:auto;gap:2px;scrollbar-width:none}
  .nav button{padding:7px 9px;white-space:nowrap;font-size:.85rem}
  .nav .lbl-long{display:none}
  main{padding-inline:16px}
}
@media (max-width:560px){
  .form{grid-template-columns:minmax(0,1fr)}

  .visit{grid-template-columns:52px minmax(0,1fr)}

  .cat-row{grid-template-columns:minmax(0,1fr) 70px 70px auto}
}

function chartSVG(data){
 const W=520,H=190,pl=46,pb=24,pt=18,max=Math.max(100,...data.map(d=>d.v));const step=max>2000?1000:max>800?250:100;const top=Math.ceil(max/step)*step;

 let g='';for(let v=0;v<=top;v+=step){g+=`<line class="grid" x1="${pl}" x2="${W-6}" y1="${y(v)}" y2="${y(v)}"/><text x="${pl-6}" y="${y(v)+4}" text-anchor="end">${v>=1000?(v/1000)+'k':v}</text>`}
 const bars=data.map((d,i)=>{const x=pl+i*bw+bw*.2,w=bw*.6,yy=y(d.v);return `<rect class="bar${d.cur?' cur':''}" x="${x}" y="${yy}" width="${w}" height="${Math.max(0,H-pb-yy)}" rx="3"/><text x="${x+w/2}" y="${H-6}" text-anchor="middle">${d.lbl}</text>${d.v?`<text class="val" x="${x+w/2}" y="${yy-5}" text-anchor="middle">${Math.round(d.v)}</text>`:''}`}).join('');
 return `<svg class="chart" viewBox="0 0 ${W} ${H}" width="100%" role="img" aria-label="Facturación de los últimos seis meses">${g}${bars}</svg>`;
}

function asisSystem(){const a=A();const hoy=parse(TODAY);
 const data={clientes:S.clientes.map(c=>({id:c.id,nombre:c.nombre,contacto:c.contacto,pueblo:c.pueblo,telefono:c.telefono,tipo:c.tipo})),
  visitas:S.citas.filter(c=>c.fecha>=addDays(TODAY,-7)&&c.fecha<=addDays(TODAY,45)).sort((x,y)=>(x.fecha+x.hora)<(y.fecha+y.hora)?-1:1).map(c=>({id:c.id,fecha:c.fecha,hora:c.hora,cliente:cli(c.clienteId).nombre,servicio:c.servicio,estado:c.estado})),
  facturas_pendientes:S.facturas.filter(f=>f.estado!=='cobrada').map(f=>({numero:f.numero,cliente:cli(f.clienteId).nombre,total:tot(f).total,vence:f.vence})),
  presupuestos:S.presupuestos.slice(-15).map(p=>({numero:p.numero,cliente:cli(p.clienteId).nombre,titulo:p.descripcion,estado:p.estado,total:tot(p).total})),
  otros_compromisos_google_calendar:GC.state==='ok'?GC.events.filter(e=>!S.citas.some(c=>c.gcalId===e.id)).map(e=>({dia:evDay(e),hora:evTime(e),titulo:e.summary})):'no conectado'};
 return `Eres el asistente del programa de gestión de "${a.nombre}", autónomo de ${a.oficio||'servicios'} con base en ${a.base} (${P().n}). Hoy es ${fDay(TODAY)} (${TODAY}); los días de esta semana empiezan el lunes ${mondayOf(TODAY)}.
El dueño te da órdenes rápidas, muchas veces dictadas desde el móvil, del tipo «agrega a Juan como cliente», «agéndame el martes a las 10 en casa de Pilar», «hazle un presupuesto a…», «la factura de Luis ya está cobrada», «apunta 60 € de gasoil».
Reglas:
- Si la orden es clara, hazla directamente con las herramientas, sin pedir confirmación. Si falta algo imprescindible (la hora de una visita, qué trabajo es), pregunta solo eso, muy breve.
- Fechas relativas: «el martes» es el próximo martes; «mañana» es ${addDays(TODAY,1)}. Escribe fechas como YYYY-MM-DD y horas como HH:MM.
- Antes de crear un cliente nuevo, mira si ya existe uno parecido en la lista y usa su id.
- Presupuestos: partidas claras (material y mano de obra), precios unitarios sin IVA realistas para ${P().n} en ${P().cur}, usa el catálogo cuando encaje. Si el oficio es electricista y el país es España, ten en cuenta REBT y boletín (CIE) cuando aplique.
- No envías nada a los clientes: tú preparas; el dueño envía con los botones de PDF, WhatsApp o Gmail que aparecen bajo cada acción.
- Si una visita choca con otro compromiso, avísalo.
- Después de actuar, confirma en 1-3 líneas. Para preguntas sobre el negocio, responde con cifras de los datos. ${isES()?'Español de España':'Español natural de '+P().n}, directo.
Catálogo (sin IVA): ${JSON.stringify((a.catalogo||[]).map(x=>[x.nombre,x.unidad,x.precio]))}
DATOS (JSON): ${JSON.stringify(data)}`}
function newAsis(){UI.asis={id:uid('as'),kind:'asistente',titulo:'Asistente',msgs:[],fecha:TODAY}}
async function saveAsis(){const c=UI.asis;if(!c||!c.msgs.length)return;await put('chats',{id:c.id,kind:'asistente',titulo:c.titulo,msgs:c.msgs.slice(-80),fecha:c.fecha,updated:Date.now()})}
async function sendAsis(text){if(!UI.asis)newAsis();const c=UI.asis;if(!text||!text.trim()||c.busy)return;
 c.msgs.push({role:'user',content:text.trim()});UI.asisInput='';if(c.titulo==='Asistente')c.titulo=text.trim().slice(0,50);
 const sm=await getSample();
 if(!sm){c.msgs.push({role:'assistant',content:'Para hacer cosas desde aquí la página necesita permiso para usar la IA. Inicia sesión en tu cuenta.'});render();return}
 c.busy=true;c.pending='';render();
 const conv=[];c.msgs.forEach(m=>{if(m.role==='action'){const last=conv[conv.length-1];const note='[Hecho: '+m.content+']';if(last&&last.role==='assistant')last.content+='\n'+note;else conv.push({role:'assistant',content:note})}else{const last=conv[conv.length-1];if(last&&last.role===m.role)last.content+='\n'+m.content;else conv.push({role:m.role,content:m.content})}});
 while(conv.length&&conv[0].role!=='user')conv.shift();
 conv[0]={role:'user',content:asisSystem()+'\n\n--- Conversación ---\n'+conv[0].content};
 try{const r=await sm(conv,{tools:asisTools(),cache:false,onText:u=>{c.pending=u.text;const el=document.getElementById('asis-pending');if(el){el.textContent=u.text||'Pensando…';scrollAsis()}}});
  if(r.text)c.msgs.push({role:'assistant',content:r.text})}
 catch(e){c.msgs.push({role:'assistant',content:e&&e.code==='subscription'?e.message:e&&e.code==='rate_limited'?'Ahora mismo estoy saturado. Prueba otra vez en un minuto.':e&&e.code==='not_granted'?'No tengo permiso para responder desde esta página. Puedes darlo en el menú Permisos de la página.':'No he podido terminar ('+((e&&e.message)||'error')+'). Revisa lo que se haya hecho arriba y prueba otra vez.'})}
 c.busy=false;c.pending='';render();saveAsis()}
function scrollAsis(){const l=document.getElementById('asis-log');if(l)l.scrollTop=l.scrollHeight}
function actHTML(m){let btns='';const r=m.ref;
 if(r&&r.k==='p'){const d=S.presupuestos.find(x=>x.id===r.id);if(d)btns=docActions('p',d)+`<button class="btn sm ghost" data-editp="${d.id}">Abrir</button>`}
 if(r&&r.k==='f'){const d=S.facturas.find(x=>x.id===r.id);if(d)btns=docActions('f',d)+`<button class="btn sm ghost" data-editf="${d.id}">Abrir</button>`}
 if(r&&r.k==='c')btns=`<button class="btn sm ghost" data-opencli="${r.id}">Ver ficha</button>`;
 if(r&&r.k==='a'){const v=S.citas.find(x=>x.id===r.id);if(v)btns=`<button class="btn sm ghost" data-goweek="${v.fecha}">Ver en la agenda</button>`}
 return `<div class="act${m.err?' err':''}"><span><b>✓</b> ${esc(m.content)}</span><span class="row">${btns}</span></div>`}
function asisLogHTML(){const c=UI.asis;return c.msgs.map(m=>m.role==='action'?actHTML(m):`<div class="msg ${m.role==='user'?'u':'a'}">${esc(m.content)}</div>`).join('')+(c.busy?`<div class="msg a" id="asis-pending">${esc(c.pending||'Pensando…')}</div>`:'')}

 <form class="chat-in" id="asis-form"><textarea id="asis-text" placeholder="Ej.: apunta un trabajo en espera para Luis, cambiar el cuadro, falta material" ${c.busy?'disabled':''}>${esc(UI.asisInput||'')}</textarea><button class="btn primary" ${c.busy?'disabled':''}>Enviar</button></form>
 <p class="small muted">En el móvil puedes dictar con el micrófono del teclado. Nada se envía a tus clientes sin que tú pulses el botón.</p></div>`}
function bindAsis(){const f=$('#asis-form');if(!f)return;const ta=$('#asis-text');ta.addEventListener('input',()=>{UI.asisInput=ta.value});
 ta.addEventListener('keydown',e=>{if(e.key==='Enter'&&!e.shiftKey&&window.innerWidth>700){e.preventDefault();sendAsis(ta.value)}});
 f.onsubmit=e=>{e.preventDefault();sendAsis(ta.value)};
 const pk=$('#asis-pick');if(pk)pk.onchange=()=>{const x=S.chats.find(c=>c.id===pk.value);if(x){UI.asis=JSON.parse(JSON.stringify(x));render()}};

function msgFacts(c,motivo){
 const pend=S.facturas.filter(f=>f.clienteId===c.id&&f.estado!=='cobrada');const next=S.citas.filter(a=>a.clienteId===c.id&&a.estado!=='hecha'&&a.fecha>=TODAY).sort((a,b)=>(a.fecha+a.hora)<(b.fecha+b.hora)?-1:1)[0];

function msgFallback(c,motivo,canal,extra){
 const a=A();const {pend,next,pres}=msgFacts(c,motivo);const nom=(c.contacto||c.nombre).split(/[ (]/)[0];let b='';
 switch(motivo){
  case 'Recordatorio de visita':b=next?`te recuerdo que el ${fDay(next.fecha)} a las ${next.hora} pasamos por ${c.pueblo} para: ${next.servicio.toLowerCase()}. Si te viene mal, dímelo y lo cambiamos.`:'quería cuadrar contigo la próxima visita. ¿Qué día te viene bien?';break;
  case 'Recordatorio de cobro':b=pend.length?`te escribo porque tengo pendiente ${pend.length>1?'las facturas':'la factura'} ${pend.map(f=>`${f.numero} de ${eur(tot(f).total)} (vencimiento ${fDate(f.vence)})`).join(' y ')}. ¿Puedes revisarlo cuando puedas?${a.iban?` Te dejo la cuenta: ${a.iban}.`:''} Si ya está hecho, ignora este mensaje.`:'no tienes nada pendiente, ¡gracias por estar al día!';break;
  case 'Enviar presupuesto':b=pres?`te paso el presupuesto ${pres.numero} para ${(pres.descripcion||'el trabajo').toLowerCase()}: ${eur(tot(pres).total)} con IVA incluido, válido ${pres.validez||30} días. Cualquier duda me dices.`:'te paso el presupuesto que hablamos.';break;
  case 'Seguimiento de presupuesto':b=pres?`¿pudiste mirar el presupuesto ${pres.numero} (${eur(tot(pres).total)})? Si quieres ajustamos algo, y si te encaja te busco hueco en las próximas semanas.`:'¿pudiste mirar el presupuesto?';break;
  case 'Ofrecer revisión eléctrica':b=`te escribo por si te interesa una revisión de la instalación eléctrica: cuadro, diferenciales, tomas de tierra y enchufes. Es rápida y evita sustos y averías. Tengo hueco en las próximas semanas por ${c.pueblo||'tu zona'}.`;break;
  case 'Aviso de cambio de cita':b=next?`tengo que mover la visita del ${fDay(next.fecha)}. ¿Te viene bien otro día de esa misma semana?`:'tengo que mover la visita. ¿Te viene bien otro día?';break;
  case 'Felicitar y pedir reseña':b=`gracias por confiar en nosotros este año. Si estás contento con el trabajo, nos ayudaría mucho una reseña en Google. ¡Un saludo!`;break;
  default:b=extra||'';}
 if(extra&&motivo!=='Mensaje libre')b+=' '+extra;
 const firma=a.nombre;
 return canal==='Email'?`Asunto: ${motivo} · ${a.nombre}\n\nHola, ${nom}:\n\n${b.charAt(0).toUpperCase()+b.slice(1)}\n\nUn saludo,\n${firma}${a.telefono?'\n'+a.telefono:''}`:`Hola ${nom}, ${b}\n${firma}`;
}

  try{const sm=await getSample();if(sm){const r=await sm.json([{role:'user',content:`Prepara el catálogo de precios inicial de un negocio de "${aj.oficio}" en ${aj.base||'una ciudad media'} (${p.n}), año ${TODAY.slice(0,4)}. Devuelve SOLO JSON con esta forma: {"catalogo":[{"nombre":"servicio o producto, corto y claro","unidad":"hora, ud, m, m2, servicio o mes","precio":número sin impuestos en ${p.cur}}],"formaPago":"condiciones de pago habituales en una frase","plazo":días habituales para pagar una factura}. Entre 10 y 16 partidas típicas de ese oficio, con precios realistas para ${p.n}.`}]);

  catch(err){console.warn(err)}
  await put('ajustes',aj);ONB_BUSY=false;UI.view='asistente';toast(aj.catalogo.length?'Oficina lista: '+aj.catalogo.length+' servicios en tu catálogo':'Oficina lista. Añade tus precios en Ajustes');render()}}

 if(d.gcalon!=null||d.gcaloff!=null){const on=d.gcalon!=null;const cur=S.ajustes.find(a=>a.id==='negocio')||{};const nw={...AJUSTES_DEF,...cur,id:'negocio',gcal:on};
